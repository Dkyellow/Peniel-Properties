<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Plus+Jakarta+Sans:wght@600&amp;display=swap');
      .brand-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 34px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 5.5px;
        text-transform: uppercase;
        fill: #A5D94A;
      }
    </style>
  </defs>

  <!-- Architectural Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Roof -->
    <path d="M 8 32 L 28 12 L 48 32" fill="none" stroke="#A5D94A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Roof -->
    <path d="M 16 38 L 28 24 L 40 38" fill="none" stroke="#A5D94A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Diamond -->
    <polygon points="28,33 32,37 28,41 24,37" fill="#FFFFFF" />
    <!-- Pillared base -->
    <line x1="16" y1="46" x2="16" y2="52" stroke="#A5D94A" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="46" x2="40" y2="52" stroke="#A5D94A" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Text -->
  <text x="74" y="44" class="brand-title">Peniel</text>
  <text x="76" y="62" class="brand-sub">PROPERTIES</text>
</svg>
