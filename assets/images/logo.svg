<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .brand-title {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 7px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Deep Navy Background with subtle rounded corners -->
  <rect width="460" height="120" rx="10" fill="#082541" />

  <!-- Architectural Mark -->
  <g transform="translate(30, 22)">
    <!-- Outer Roof (Lime Green) -->
    <path d="M 12 40 L 40 14 L 68 40" fill="none" stroke="#A5D94A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Roof (Lime Green) -->
    <path d="M 22 47 L 40 30 L 58 47" fill="none" stroke="#A5D94A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Small White Diamond Architectural Detail -->
    <polygon points="40,42 44.5,46.5 40,51 35.5,46.5" fill="#FFFFFF" />
    <!-- Minimalist Baseline Pillar Accents -->
    <line x1="22" y1="58" x2="22" y2="68" stroke="#A5D94A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="58" y1="58" x2="58" y2="68" stroke="#A5D94A" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark "Peniel" -->
  <text x="125" y="66" fill="#FFFFFF" class="brand-title">Peniel</text>

  <!-- Subtitle "PROPERTIES" in widely spaced understated lettering -->
  <text x="128" y="90" fill="#E7EBEF" class="brand-sub">PROPERTIES</text>
  
  <!-- Subtle lime green accent dot -->
  <circle cx="270" cy="86" r="2.5" fill="#A5D94A" />
</svg>
